---
name: Pohang University of Science and Technology — Error Semantics
description: >-
  Error behaviour observed on POSTECH's institution-operated machine-readable surfaces. Each of the
  three surfaces uses a different and standards-defined error vocabulary, and two of them report
  failure inside a 200 response rather than through an HTTP status — which is normal for their
  protocols and worth stating plainly for anyone writing a client.
generated: '2026-08-30'
method: probed
source: Live probes of oasis.postech.ac.kr and plms.postech.ac.kr on 2026-08-30.
x-operator: institution
url: https://raw.githubusercontent.com/api-evangelist/postech/main/errors/postech-errors.yml

surfaces:
  - surface: POSTECH OASIS Repository OAI-PMH
    base_url: https://oasis.postech.ac.kr/oai/request
    transport_status: >-
      Protocol errors are returned with HTTP 200 and an <error code="..."> element inside the
      OAI-PMH envelope. Do not branch on HTTP status alone.
    format: OAI-PMH 2.0 error element (XML)
    codes:
      - code: badArgument
        meaning: Illegal, missing, repeated or unrecognised argument for the requested verb.
      - code: badVerb
        meaning: verb argument missing, repeated, or not one of the six OAI-PMH verbs.
      - code: badResumptionToken
        meaning: resumptionToken is invalid or expired. Relevant here — list responses page at 100.
      - code: cannotDisseminateFormat
        meaning: metadataPrefix not supported for the item or the repository. Twelve are supported.
      - code: idDoesNotExist
        meaning: identifier is unknown or illegal in this repository.
      - code: noRecordsMatch
        meaning: The from/until/set combination selects nothing.
      - code: noMetadataFormats
        meaning: No metadata formats available for the specified item.
      - code: noSetHierarchy
        meaning: Not applicable here — this repository does support sets (163 of them).
    method: derived
    source: >-
      OAI-PMH 2.0 specification, applied to the verified deployment. The code list is the
      protocol's; the applicability notes are from live probes of this endpoint on 2026-08-30.

  - surface: POSTECH LMS (PLMS) Moodle Web Services
    base_url: https://plms.postech.ac.kr/webservice/rest/server.php
    transport_status: HTTP 200 with a fault body; the REST format does not use HTTP error codes.
    format: Moodle exception object (JSON or XML depending on moodlewsrestformat)
    observed:
      - errorcode: invalidtoken
        http_status: 200
        body: '{"exception":"moodle_exception","errorcode":"invalidtoken","message":"잘못된 토큰 - 토큰이 발견되지 않았습니다."}'
        detail: >-
          Returned to any caller without a wstoken. The message is localised to Korean, which is
          itself a useful signal: this deployment serves ko-KR by default.
      - errorcode: codingerror
        http_status: 200
        body: '{"error":"...필수 매개변수 (id) 누락","errorcode":"codingerror"}'
        detail: Returned by the AJAX service layer (/lib/ajax/) on a malformed request.
    method: probed
    source: https://plms.postech.ac.kr/webservice/rest/server.php

  - surface: POSTECH LMS (PLMS) LTI 1.3 token endpoint
    base_url: https://plms.postech.ac.kr/mod/lti/token.php
    transport_status: HTTP 400 with an RFC 6749 error object. The one surface here that uses HTTP status correctly.
    format: OAuth 2.0 error response (RFC 6749 §5.2)
    observed:
      - error: invalid_request
        http_status: 400
        body: '{ "error" : "invalid_request" }'
        detail: Returned to a GET with no grant_type or client_assertion.
    method: probed
    source: https://plms.postech.ac.kr/mod/lti/token.php

  - surface: OASIS bot challenge
    base_url: https://oasis.postech.ac.kr/server/api
    transport_status: >-
      HTTP 200 with an HTML JavaScript challenge, not an error. A naive client that trusts the
      status code will treat a challenge page as a successful API response — the soft-200 trap.
    format: HTML challenge document
    method: probed
    source: https://oasis.postech.ac.kr/server/api
