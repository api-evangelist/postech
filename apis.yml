- aid: postech:plms-lti
  name: POSTECH LMS (PLMS) LTI 1.3 Advantage Platform
  x-operator: institution
  x-operator-basis: >-
    plms.postech.ac.kr is POSTECH's registrable domain; the host is fronted by a Naver Cloud load
    balancer, which is hosting, not operation. The LTI platform identity is POSTECH's — the keys
    below sign POSTECH-issued id_tokens.
  x-contract-origin: >-
    The interface is Moodle's implementation of the IMS Global / 1EdTech LTI 1.3 specification, not
    a POSTECH-authored contract. No Moodle or LTI specification document is saved under POSTECH's
    slug; what is recorded here is POSTECH's deployment of it.
  description: >-
    POSTECH's learning management system is an institution-hosted Moodle (coursemos distribution)
    acting as an LTI 1.3 Advantage platform, and unusually for this cohort its platform endpoints
    are publicly reachable. The JSON Web Key Set at /mod/lti/certs.php returns a real RSA RS256 key
    (kid 13acf24233904ff6db00) with no credentials — the keyset an external tool needs to verify
    POSTECH-issued id_tokens — and the paired OAuth 2.0 token service at /mod/lti/token.php answers
    an unparameterised request with an RFC 6749 invalid_request object rather than an HTML page.
    Tool registration itself is an LMS administrator action and is not open to outside developers.
  humanURL: https://plms.postech.ac.kr/
  baseURL: https://plms.postech.ac.kr/mod/lti/certs.php
