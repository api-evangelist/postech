apis:
  - aid: postech:oasis-oai-pmh
    name: OASIS Repository OAI-PMH
    description: >-
      Live OAI-PMH 2.0 metadata-harvesting endpoint for the POSTECH Library
      OASIS institutional repository (DSpace). Verified to respond to Identify,
      ListMetadataFormats, and ListSets. Repository name reported as "OASIS
      Repository@POSTECHLIBRARY"; earliest datestamp 2014-12-01; granularity
      YYYY-MM-DDThh:mm:ssZ. Supports 12 metadata formats including oai_dc, qdc,
      mods, mets, marc, didl, ore, rdf, dim, xoai, etdms, and uketd_dc, exposing
      163 sets across academic departments and content types (journal papers,
      conference papers, theses).
    humanURL: https://www.openarchives.org/OAI/openarchivesprotocol.html
    baseURL: https://oasis.postech.ac.kr/oai/request
