apis:
- aid: postech:oasis-oai-pmh
  name: POSTECH OASIS Repository OAI-PMH
  x-operator: institution
  x-operator-basis: >-
    oasis.postech.ac.kr is under POSTECH's registrable domain and resolves to 141.223.5.61, inside
    POSTECH's own /16 alongside www.postech.ac.kr and idpass.postech.ac.kr. The repository software
    is DSpace and the OAI adminEmail is a Korean integrator address, but the host, the deployment
    and the corpus are POSTECH's.
  description: >-
    Anonymous OAI-PMH 2.0 metadata harvesting over the POSTECH Library OASIS institutional
    repository. Verified live on 2026-08-30: repositoryName "OASIS Repository@POSTECHLIBRARY",
    repositoryIdentifier oasis.postech.ac.kr, protocolVersion 2.0, earliestDatestamp
    2014-12-01T11:46:04Z, granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord transient. Twelve
    metadata formats (oai_dc, qdc, mods, mets, marc, didl, ore, rdf, dim, xoai, etdms, uketd_dc),
    163 sets across departments and content types, and a ListRecords completeListSize of 106,805
    records paged 100 at a time with working resumption tokens. This path is exempt from the
    JavaScript bot challenge that fronts the rest of the host, which makes it the single usable
    programmable surface POSTECH offers to an anonymous client.
