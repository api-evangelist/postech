- aid: postech:identity-federation
  name: POSTECH SAML 2.0 Identity Provider
  x-operator: institution
  x-operator-basis: >-
    idpass.postech.ac.kr resolves to 141.223.5.141 inside POSTECH's own network, and the eduGAIN
    entity record names POSTECH as the entity with scope postech.ac.kr. An identity provider is
    institution-operated by definition — it asserts who is a member of the institution.
  description: >-
    POSTECH's own SAML 2.0 identity provider, entityID
    https://idpass.postech.ac.kr/idp/simplesamlphp, registered in KAFE (the Korea Access Federation,
    run on KREONET) since registrationInstant 2017-06-23 and first seen in eduGAIN 2017-06-29. The
    metadata is machine-readable and internationally resolvable through the eduGAIN technical
    database: IDPSSODescriptor with SingleSignOnService and SingleLogoutService under
    /simplesaml/saml2/idp/, an X.509 signing key, shibmd:Scope postech.ac.kr, support for the
    REFEDS Research and Scholarship entity category, a SIRTFI assurance assertion and a REFEDS
    security contact. The IdP's own metadata URL is admin-gated and 302s to a login form, so the
    federation copy is the public one. The software is SimpleSAMLphp rather than Shibboleth.
  humanURL: https://www.kafe.or.kr/
  baseURL: https://idpass.postech.ac.kr/
  x-sso-url: https://idpass.postech.ac.kr/simplesaml/saml2/idp/SSOService.php
  x-slo-url: https://idpass.postech.ac.kr/simplesaml/saml2/idp/SingleLogoutService.php
