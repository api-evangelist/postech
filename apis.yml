---
aid: postech
name: Pohang University of Science and Technology
description: >-
  Pohang University of Science and Technology (POSTECH) is a private research
  university in Pohang, South Korea, founded in 1986 by the steelmaker POSCO and
  ranked #87 in the QS World University Rankings 2025. POSTECH operates a public
  English-language website and a range of authenticated institutional systems
  (PODIUM portal, PLMS learning management, admissions, and certificate
  services). Its primary confirmed public, machine-readable API surface is the
  POSTECH Library OASIS institutional repository, a DSpace platform that exposes
  a live OAI-PMH 2.0 metadata-harvesting endpoint. No general-purpose developer
  portal or open-data API program was found; most other systems are
  login-gated.
