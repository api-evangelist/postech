description: >-
  Pohang University of Science and Technology (POSTECH) is a private research university in Pohang,
  North Gyeongsang, South Korea, founded in 1986 by the steelmaker POSCO and consistently ranked
  inside the QS world top 100. POSTECH operates no developer portal, no open-data program and no
  API it authored itself — but it is not empty, and three genuinely institution-operated
  machine-readable surfaces were verified live on 2026-08-30, all of them on POSTECH's own network
  (141.223.0.0/16). The OASIS institutional repository serves a fully anonymous OAI-PMH 2.0
  harvesting endpoint over a corpus of 106,805 records in twelve metadata formats across 163 sets,
  reaching back to 2014. POSTECH runs its own SAML 2.0 identity provider at idpass.postech.ac.kr,
  registered in the KAFE federation since 2017 and resolvable through eduGAIN, supporting the
  REFEDS Research and Scholarship entity category and asserting SIRTFI — machine-readable
  institutional infrastructure that almost nothing in this cohort catalogues. And POSTECH's LMS
  publishes a live, public LTI 1.3 Advantage platform keyset and OAuth 2.0 token endpoint, which
  most institution-hosted Moodles keep unreachable. Everything else is a login wall or someone
  else's platform: the PODIUM portal, admissions and certificate systems are gated; the DSpace REST
  interface sits behind a JavaScript bot challenge that returns 200 with a challenge shell; and the
  thesis pipeline runs through postech.dcollection.net, a tenancy on the KERIS-operated national
  dCollection platform, recorded here as a relationship rather than as POSTECH's engineering.
