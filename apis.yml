- aid: postech:dcollection
  name: POSTECH dCollection Thesis Repository (KERIS tenancy)
  x-operator: tenant
  x-operator-basis: >-
    postech.dcollection.net is an institution-specific subdomain on the KERIS-operated national
    dCollection platform and resolves to 210.102.100.94, outside POSTECH's network. The theses and
    the DOIs of record are POSTECH's; the platform, the software and any contract it exposes are
    KERIS's. Recorded as a relationship, with no dCollection specification saved under POSTECH's
    slug.
  description: >-
    POSTECH's tenancy on dCollection, the Korea Education and Research Information Service national
    digital thesis and dissertation distribution system. The relationship is evidenced from
    POSTECH's own OAI-PMH output: records harvested from OASIS carry dc:identifier values pointing
    at postech.dcollection.net item pages, so the thesis pipeline demonstrably runs through this
    platform. This is a real institutional surface and one of the few programmable footholds
    POSTECH has, but it is not POSTECH's engineering.
  humanURL: https://postech.dcollection.net/
  baseURL: https://postech.dcollection.net/
