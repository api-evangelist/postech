x-coverage:
  state: covered
  reason: covered
  detail: >-
    POSTECH publishes no developer portal, no API documentation and no open-data program, and the
    June 2026 profile concluded there was one surface here. Re-probed on 2026-08-30 there are four
    institution-operated surfaces plus one tenancy, and three of the four are machine-readable
    without credentials. The OASIS OAI-PMH endpoint answers Identify, ListMetadataFormats, ListSets
    and ListRecords anonymously — ListRecords returns real Dublin Core with completeListSize
    106,805, which is the probe that distinguishes a working harvesting surface from a link.
    POSTECH's SAML 2.0 identity provider is registered in eduGAIN through KAFE and its metadata is
    publicly retrievable from the federation even though the IdP's own metadata URL is admin-gated
    behind a login redirect. The LMS exposes an LTI 1.3 platform JWKS and OAuth 2.0 token endpoint
    without credentials. Two things are genuinely closed and are recorded as such rather than as
    gaps: the DSpace REST interface returns HTTP 200 carrying a JavaScript bot challenge instead of
    JSON, and Moodle Web Services answers every anonymous call with errorcode invalidtoken. No
    vendor contract has been saved under POSTECH's name; the dCollection thesis platform is
    recorded as a tenant relationship. The Korean-language surface was searched as well as the
    English one — the privacy and copyright policies exist on both, and the LMS returns Korean
    error messages by default.
